<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-ag" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 식단 관리 HealthMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      // 다크모드 FOUC(Flash of Unstyled Content) 방지
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Pretendard', 'system-ui', 'sans-serif'],
            },
            colors: {
              'primary-blue': '#0A84FF',
              'state-success': '#34C759',
              'orange-500': '#FF9500',
              'gray-100': '#FFFFFF',
              'gray-90': '#F7F8FA',
              'gray-70': '#E9EDF0',
              'gray-50': '#CED4DA',
              'gray-text': '#334155',
              'gray-subtext': '#64748b',
              'shadow-color': 'rgba(0, 0, 0, 0.08)',
              // Dark mode colors
              'dark-bg': '#0f172a',
              'dark-card': '#1e293b',
              'dark-border': '#334152',
              'dark-text': '#e2e8f0',
              'dark-subtext': '#94a3b8',
            },
            boxShadow: {
              'card': '0 4px 12px 0 rgba(0, 0, 0, 0.08)',
            },
             animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-up': 'slideUp 0.5s ease-in-out',
              'check-grow': 'checkGrow 0.4s ease-in-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              },
              checkGrow: {
                '0%': { transform: 'scale(0.5)', opacity: 0 },
                '100%': { transform: 'scale(1)', opacity: 1 },
              }
            }
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Pretendard', sans-serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-90 dark:bg-dark-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
